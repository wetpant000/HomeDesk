[project]
name = "homedesk"
version = "0.1.0"
description = "An MCP agent that files household paperwork, tracks every date and chases issues until they're resolved."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "mcp",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[project.scripts]
homedesk-web = "homedesk.api:main"
homedesk-mcp = "homedesk.mcp_server:main"
homedesk-seed = "homedesk.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homedesk"]
